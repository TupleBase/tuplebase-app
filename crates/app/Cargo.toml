[package]
name = "tuplebase-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tuplebase-core = { path = "../core" }
anyhow = "1.0.104"
# Pre-1.0 and fast-moving: pin exactly, upgrade in a dedicated commit.
gpui-kit = { version = "=0.9.0", features = ["tree-sitter-sql"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
gpui-kit = { version = "=0.9.0", features = ["tree-sitter-sql", "test-support"] }
