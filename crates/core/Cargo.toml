[package]
name = "tuplebase-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
futures-util = "0.3.34"
keyring = "4.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "mysql",
    "chrono",
    "uuid",
    "json",
    "rust_decimal",
] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync"] }
ureq = { version = "3.5.1", features = ["json"] }

[dev-dependencies]
tempfile = "3"
