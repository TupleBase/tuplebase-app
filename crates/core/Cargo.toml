[package]
name = "tuplebase-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
futures-util = "0.3.34"
keyring = "4.2.0"
russh = { version = "0.65.1", default-features = false, features = ["ring", "rsa"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "mysql",
    "sqlite-bundled",
    "chrono",
    "uuid",
    "json",
    "rust_decimal",
] }
# The SQLite that sqlx compiles in, for its parser in the read-only guard (`db/sqlite.rs`).
# Keep it on the version sqlx uses, so there is one SQLite.
libsqlite3-sys = { version = "0.37.0", default-features = false }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
sha2 = "0.10.9"
ureq = { version = "3.5.1", features = ["json"] }
# Default features off: they pull in aws-lc, a C library. `rustls-ring` keeps TLS pure Rust.
aws-config = { version = "1.13.2", default-features = false, features = ["rt-tokio", "sso", "credentials-process", "behavior-version-latest"] }
aws-sdk-secretsmanager = { version = "1.127.0", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
aws-sdk-ssm = { version = "1.136.0", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# Describe calls for discovery and the IAM auth token generator; same TLS setup as above.
aws-sdk-rds = { version = "1.164.0", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
aws-smithy-http-client = { version = "1.5.2", default-features = false, features = ["rustls-ring"] }
aws-types = "1.7.0"
# Edits Codex's config.toml in place, keeping its comments and layout.
toml_edit = "0.25.19"
aws-sdk-redshift = { version = "1.131.0", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
aws-sdk-redshiftserverless = { version = "1.132.0", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }

# Windows only: a job object ends the chat agent with the app, even when the app
# crashes. Pure Rust bindings, already in the tree through other crates.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
# A fixed clock for signing tests, and a PEM reader to check the RDS bundle; both are
# already in the tree through the AWS SDK and sqlx.
aws-smithy-async = "1.3.1"
rustls-pki-types = "1.15.1"
