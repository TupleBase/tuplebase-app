[package]
name = "tuplebase-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tuplebase-core = { path = "../core" }
anyhow = "1.0.104"
rmcp = { version = "3.9.0", features = ["server", "transport-io", "macros"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std"] }
