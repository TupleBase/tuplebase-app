# Local databases for development and integration tests.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: app
      # Local test database only: accepts connections without a password.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["55432:5432"]
    volumes:
      - ./dev/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
      - ./dev/demo-postgres.sql:/docker-entrypoint-initdb.d/zz-demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U dev -d app -c 'select 1 from users limit 1'"]
      interval: 2s
      retries: 30
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_USER: dev
      MARIADB_PASSWORD: dev
      MARIADB_DATABASE: app
      MARIADB_ROOT_PASSWORD: root
    ports: ["53306:3306"]
    volumes:
      - ./dev/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
      - ./dev/mariadb-test-user.sql:/docker-entrypoint-initdb.d/zz-test-user.sql:ro
      # After the test user, which it grants the demo databases to.
      - ./dev/demo-mariadb.sql:/docker-entrypoint-initdb.d/zzz-demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb -h 127.0.0.1 -udev -pdev app -e 'select 1 from users limit 1'"]
      interval: 2s
      retries: 30
  # Fake AWS (Secrets Manager, Parameter Store) for the tests of credentials kept in AWS.
  aws:
    image: motoserver/moto:5.1.4
    ports: ["54566:5000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as r; r.urlopen('http://127.0.0.1:5000/moto-api/')"]
      interval: 2s
      retries: 30
  # SSH bastion for tunnel tests; it reaches the databases by service name.
  sshd:
    image: alpine:3.22
    command:
      - sh
      - -c
      - |
        apk add --no-cache openssh >/dev/null
        ssh-keygen -A >/dev/null
        adduser -D -s /bin/sh dev
        echo dev:dev | chpasswd
        exec /usr/sbin/sshd -D -e -o AllowTcpForwarding=yes -o PasswordAuthentication=yes
    ports: ["52222:22"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 22"]
      interval: 2s
      retries: 30
  # MongoDB as a single-node replica set, so `hello` and secondaries behave as in
  # production. It listens on 57017 inside the container too: the set names its member
  # localhost:57017, which must be the same address from the host. A replica set with
  # users needs a key file; this one is made fresh on each start.
  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: dev
      MONGO_INITDB_ROOT_PASSWORD: dev
    entrypoint:
      - bash
      - -c
      - |
        head -c 756 /dev/urandom | base64 > /tmp/keyfile
        chmod 400 /tmp/keyfile && chown mongodb:mongodb /tmp/keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /tmp/keyfile --bind_ip_all --port 57017
    ports: ["57017:57017"]
    volumes:
      - ./dev/seed-mongo.js:/docker-entrypoint-initdb.d/seed-mongo.js:ro
    # The seed runs on a server the image starts first, without the replica set, so the
    # set is started here, once, and the service is healthy when it has a primary.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --port 57017 -u dev -p dev --quiet --eval
          "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:57017'}]}) }
          if (!db.hello().isWritablePrimary) quit(1)"
      interval: 2s
      retries: 60
