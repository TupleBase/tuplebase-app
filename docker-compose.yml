# Local databases for development and integration tests.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: app
      # Local test database only: accepts connections without a password.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["55432:5432"]
    volumes: ["./dev/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U dev -d app -c 'select 1 from users limit 1'"]
      interval: 2s
      retries: 30
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_USER: dev
      MARIADB_PASSWORD: dev
      MARIADB_DATABASE: app
      MARIADB_ROOT_PASSWORD: root
    ports: ["53306:3306"]
    volumes:
      - ./dev/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
      - ./dev/mariadb-test-user.sql:/docker-entrypoint-initdb.d/zz-test-user.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb -h 127.0.0.1 -udev -pdev app -e 'select 1 from users limit 1'"]
      interval: 2s
      retries: 30
  # SSH bastion for tunnel tests; it reaches the databases by service name.
  sshd:
    image: alpine:3.22
    command:
      - sh
      - -c
      - |
        apk add --no-cache openssh >/dev/null
        ssh-keygen -A >/dev/null
        adduser -D -s /bin/sh dev
        echo dev:dev | chpasswd
        exec /usr/sbin/sshd -D -e -o AllowTcpForwarding=yes -o PasswordAuthentication=yes
    ports: ["52222:22"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 22"]
      interval: 2s
      retries: 30
