name: Release

# Started by hand: gh workflow run release.yml -f version=0.2.0
# Bumps the version on main, tags it, builds every platform, publishes a GitHub Release,
# then points the Homebrew cask at it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0"
        required: true

concurrency: release

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      - run: scripts/release-tag.sh "$VERSION"
        env:
          VERSION: ${{ inputs.version }}

  build:
    needs: tag
    strategy:
      matrix:
        include:
          - { os: macos-15, platform: macos-arm64 }
          - { os: windows-2025, platform: windows-x64 }
          # Oldest supported Ubuntu, so the binary runs on older glibc.
          - { os: ubuntu-22.04, platform: linux-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}
      - if: runner.os == 'Linux'
        run: scripts/ci-linux-deps.sh
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo build --release -p tuplebase-app -p tuplebase-mcp
      - run: scripts/package.sh "${{ matrix.platform }}"
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: (cd dist && sha256sum * > SHA256SUMS)
      - run: gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --title "TupleBase $VERSION" --notes "$NOTES" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          NOTES: >-
            **macOS:** use the [command-line install](https://github.com/TupleBase/tuplebase-app/blob/main/docs/INSTALL.md#command-line-recommended)
            to avoid the first-launch block.
            Already downloaded the DMG? [Allow it in a few steps](https://github.com/TupleBase/tuplebase-app/blob/main/docs/INSTALL.md#macos-tuplebase-not-opened).

  # The checksum only exists once the release is built, so this lands on main after the tag.
  cask:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Point the Homebrew cask at the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir "$RUNNER_TEMP"
          sha=$(awk -v file="TupleBase-$VERSION-macos-arm64.dmg" '$2 == file { print $1 }' "$RUNNER_TEMP/SHA256SUMS")
          scripts/update-cask.sh "$VERSION" "$sha"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update the Homebrew cask to $VERSION" Casks/tuplebase.rb
          git push origin HEAD:main

  verify-install:
    needs: cask
    uses: ./.github/workflows/install-test.yml
