name: CI

# Validates every push to main. Never tags or publishes; see release.yml.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "Casks/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "Casks/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # No debug info in CI: faster builds and links, much smaller caches.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  linux:
    name: Linux (fmt, clippy, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      # Pulls while clippy compiles, so the databases start instantly later.
      - run: nohup docker compose pull -q > /dev/null 2>&1 &
      - run: scripts/ci-linux-deps.sh
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: docker compose up -d --wait
      - run: cargo test --workspace
        env:
          TUPLEBASE_IT: "1"

  windows:
    name: Windows (build, tests)
    runs-on: windows-2025
    env:
      # Far faster than the default MSVC linker on large binaries.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace

  macos:
    name: macOS (build, tests)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace
