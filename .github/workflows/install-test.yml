name: Install test

# Installs the latest published release with the one-line installers.
# Runs after every release, or by hand: gh workflow run install-test.yml
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  unix:
    strategy:
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: sh install.sh
      - run: test -x "$HOME/.local/bin/tuplebase-mcp"
      # The app's updater downloads the files first, then runs the installer on them.
      - name: Install from downloaded files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern '*' --dir "$RUNNER_TEMP/update"
          TUPLEBASE_DOWNLOAD_DIR="$RUNNER_TEMP/update" sh install.sh

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - run: ./install.ps1
      - run: |
          foreach ($bin in "tuplebase-app.exe", "tuplebase-mcp.exe") {
            if (-not (Test-Path "$env:LOCALAPPDATA\Programs\TupleBase\$bin")) { throw "missing $bin" }
          }
      - name: Install from downloaded files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo $env:GITHUB_REPOSITORY --pattern '*' --dir "$env:RUNNER_TEMP\update"
          $env:TUPLEBASE_DOWNLOAD_DIR = "$env:RUNNER_TEMP\update"
          ./install.ps1
