[workspace]
resolver = "3"
members = ["crates/core", "crates/app", "crates/mcp"]

[workspace.package]
version = "0.12.0"
edition = "2024"
license = "MIT"
publish = false

# Line tables only: panics and backtraces still show file and line. Measured on Linux, a
# clean build takes about 17% less time, a rebuild after a change in `app` about 40% less,
# and target/ shrinks from 12 to 7 GB. For a debugger's local variables, see
# docs/DEVELOPMENT.md. `cargo test` inherits this; release builds are unchanged.
[profile.dev]
debug = "line-tables-only"
